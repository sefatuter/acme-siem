  <agent_config>
    <!-- Shared agent configuration here -->
    <wodle name="command">
      <disabled>yes</disabled>
      <tag>ps-list</tag>
      <command>ps -eo user,pid,cmd</command>
      <interval>10s</interval>
      <ignore_output>no</ignore_output>
      <run_on_start>yes</run_on_start>
      <timeout>5</timeout>
    </wodle>
    <wodle name="command">
      <disabled>yes</disabled>
      <tag>cpu-monitor</tag>
      <command>ps -eo %cpu,comm,user,pid</command>
      <interval>10s</interval>
      <run_on_start>yes</run_on_start>
      <ignore_output>no</ignore_output>
    </wodle>
    <wodle name="command">
      <disabled>yes</disabled>
      <tag>port-monitor</tag>
      <command>ss -tuln | grep LISTEN</command>
      <interval>10s</interval>
      <run_on_start>yes</run_on_start>
      <ignore_output>no</ignore_output>
    </wodle>
    
    <wodle name="command">
      <disabled>no</disabled>
      <tag>rule100410-collector</tag>
      <command>/var/ossec/custom/bin/collect_rule100410.sh</command>
      <interval>10s</interval>
      <ignore_output>yes</ignore_output>
    </wodle>
    
    <wodle name="command">
      <disabled>yes</disabled>
      <tag>rule100150-collector</tag>
      <command>/bin/bash /var/ossec/custom/bin/collect_rule100150.sh</command>
      <timeout>10</timeout>
      <ignore_output>yes</ignore_output>
    </wodle>
    
  </agent_config>
